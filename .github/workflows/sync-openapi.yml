name: Sync OpenAPI spec

# Keeps api-reference/openapi.json in step with the live API.
# Runs daily + on demand; commits directly to main when the spec changes.
# (The previous PR-based flow needed "Allow GitHub Actions to create and
# approve pull requests" in repo settings, which is disabled — every run
# failed at PR creation. Direct commit only needs contents: write, which
# the default GITHUB_TOKEN already has.)
#
# When a sync lands new endpoints, remember the hand-maintained pages it
# can't update: api-reference/tiers.mdx, api-reference/data-windows.mdx,
# changelog/overview.mdx, mcp/tools.mdx.

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live spec and rewrite to docs format
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 10 https://api.coinversa.ai/openapi.json -o /tmp/live.json
          python3 - <<'PY'
          import json
          live = json.load(open("/tmp/live.json"))
          # Mintlify "Try it" base URL — paths keep the /api/public/v1 prefix.
          live["servers"] = [{"url": "https://api.coinversa.ai", "description": "Production"}]
          # huma emits an invalid `scheme` on the apiKey security scheme;
          # Mintlify rejects the whole spec for it. Strip it.
          ss = live.get("components", {}).get("securitySchemes", {})
          if "apiKey" in ss:
              ss["apiKey"].pop("scheme", None)
          json.dump(live, open("api-reference/openapi.json", "w"), indent=2, ensure_ascii=False)
          print("paths:", len(live["paths"]))
          PY

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet api-reference/openapi.json; then
            echo "No spec changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-reference/openapi.json
          git commit -m "chore: sync OpenAPI spec from api.coinversa.ai"
          git push
